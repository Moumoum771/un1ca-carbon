name: Build :)

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - 'sixteen'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run shellcheck
        run: |
          CODE=0
          while IFS= read -r f; do
            shellcheck -e SC1090,SC1091 -s bash "$f" || CODE=1
          done < <(find platform scripts target unica -name "*.sh" -not -name "*ssi.sh" -not -name "config.sh" -not -name "sff.sh")
          exit $CODE

  generate-matrix:
    name: Generate matrix
    needs: shellcheck
    runs-on: ubuntu-24.04

    outputs:
      matrix: ${{ steps.generate-matrix.outputs.matrix }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate CI matrix
        id: generate-matrix
        run: |
          if [ -d "target" ] && [ "$(ls -A target)" ]; then
            matrix="$(find target -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')"
          elif [ -d "carbon_ours" ]; then
            matrix="$(find carbon_ours -mindepth 1 -maxdepth 1 -type d -name 'target_*' -printf '%f\n' | sed 's/target_//' | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')"
          else
            matrix='["dm1q", "a70q"]'
          fi
          
          if [ "$matrix" = "[]" ] || [ -z "$matrix" ]; then
            matrix='["dm1q", "a70q"]'
          fi

          echo "matrix=$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: [shellcheck, generate-matrix]
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.generate-matrix.outputs.matrix) }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          preinstalled-runtimes: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            attr ccache clang ffmpeg libbrotli-dev libbz2-dev \
            libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp \
            libncurses-dev lib32ncurses-dev libncursesw6
          sudo modprobe erofs f2fs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Execute Carbon Build via Orchestrator
        run: |
          set -x
          chmod +x make_carbon.sh
          ./make_carbon.sh ${{ matrix.target }}
